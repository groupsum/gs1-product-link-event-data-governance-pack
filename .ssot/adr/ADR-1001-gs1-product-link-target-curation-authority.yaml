body: |-
  ## Context
  
  The curated source set for GS1 product link behavior needs to keep GS1 Digital Link, GS1 Digital Link URI Syntax, GS1 Conformant Resolver, and GS1 Web Vocabulary targets distinct from visibility event and product master-data targets.
  
  ## Decision
  
  This repository treats GS1 Digital Link, GS1 Digital Link URI Syntax, GS1 Conformant Resolver, and GS1 Web Vocabulary as the authoritative source family for curated product-link targets.
  
  The curation boundary includes URI construction, URI syntax, resolver behavior, linked-data publication vocabulary, and product-link representation targets.
  
  The curation boundary does not authorize downstream implementation claims, runtime feature rows, evidence rows, or cross-pack dependency statements.
  
  ## Consequences
  
  Repo-local source updates for product-link targets must preserve the GS1 Digital Link, URI syntax, resolver, and Web Vocabulary source family as separate curation concerns.

