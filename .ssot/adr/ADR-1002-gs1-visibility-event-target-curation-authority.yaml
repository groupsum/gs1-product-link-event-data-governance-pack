body: |-
  ## Context
  
  Visibility event targets use EPCIS event structures and CBV controlled vocabularies. These targets should not be collapsed into product master data or URI resolver behavior.
  
  ## Decision
  
  This repository treats EPCIS and CBV as the authoritative source family for curated visibility-event targets.
  
  The curation boundary includes EPCIS event envelope targets, EPCIS event type targets, CBV business-step targets, CBV disposition targets, and related visibility-event vocabulary targets.
  
  The curation boundary does not authorize downstream implementation claims, runtime event pipelines, evidence rows, or cross-pack dependency statements.
  
  ## Consequences
  
  Repo-local source updates for visibility events must preserve EPCIS and CBV as distinct target authorities and must keep event semantics separate from product-link URI mechanics.

