body: |-
  ## Requirements
  
  Source curation for product master-data targets MUST retain GS1 General Specifications for identifier authority.
  
  Source curation MUST retain GS1 Global Data Model for product and trade item attribute authority.
  
  Source curation MUST retain GDSN for product data synchronization authority.
  
  Source curation MUST retain GS1 Web Vocabulary where product, organization, location, and trade item linked-data semantics are curated.

