body: |-
  ## Requirements
  
  Source curation for GS1 product-link targets MUST retain GS1 Digital Link, GS1 Digital Link URI Syntax, GS1 Conformant Resolver, and GS1 Web Vocabulary as explicit authority sources.
  
  Source curation MUST distinguish URI construction targets from resolver behavior targets and linked-data vocabulary targets.
  
  Source curation MUST NOT treat downstream implementation claims, runtime features, evidence rows, or release boundaries as part of this repository-local source authority.

