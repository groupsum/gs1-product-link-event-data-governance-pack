body: |-
  ## Requirements
  
  Source curation for GS1 visibility-event targets MUST retain EPCIS as the authority for event envelope and event type targets.
  
  Source curation MUST retain CBV as the authority for controlled vocabulary targets such as business steps and dispositions.
  
  Source curation MUST keep visibility-event target authority separate from URI resolver authority and product master-data authority.

